spring.application.name=smartly-english-bckend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smartly_english
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-uto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enbled=true

# Server
server.port=8080

# Actutor
management.endpoints.web.exposure.include=health,info